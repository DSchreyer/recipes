{% extends "base.html" %}
{% load i18n static %}

{# The chrome comes from Tandoor; only the kitchen's own pieces are styled here,
   so the page keeps following the instance's theme. #}

{% block extra_head %}
<style>
    .page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; margin-bottom: 1rem; }
    .page-head__sub { color: #6c757d; }
    .page-head__stats .stat { margin-left: 1rem; color: #6c757d; }

    .filters summary { cursor: pointer; font-weight: 600; margin-bottom: .5rem; }
    .filters__count { display: inline-block; min-width: 1.4rem; padding: 0 .35rem; border-radius: .7rem;
        background: #6c757d; color: #fff; font-size: .75rem; text-align: center; }
    .filter-axis { font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: #6c757d; }

    .picker-toolbar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; justify-content: space-between; }
    .picker-toolbar__actions { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; }
    .picker-toolbar__search { min-width: 14rem; flex: 0 1 20rem; }

    .picked-foods { display: flex; flex-wrap: wrap; gap: .35rem; }
    .picked-chip { padding: .15rem .55rem; border-radius: 1rem; border: 1px solid #ced4da;
        color: inherit; text-decoration: none; font-size: .85rem; }
    .picked-chip--on { background: #e9ecef; border-color: #adb5bd; }

    .card-placeholder { background: #e9ecef; }
    .card-placeholder__letter { font-size: 3rem; font-weight: 700; color: #adb5bd; }
    .card-actions { margin-top: .5rem; }
    .cook-label { font-size: .8rem; color: #6c757d; margin-right: .35rem; }
    .star-picker { display: inline-flex; gap: .1rem; }
    .star-picker__star { background: none; border: 0; padding: 0 .1rem; line-height: 1; color: #f0ad4e; font-size: 1.15rem; }
    .star-picker__star:hover, .star-picker__star:focus { color: #d98c1f; }
    .cook-details { margin-top: .35rem; font-size: .85rem; }
    .cook-details summary { color: #6c757d; cursor: pointer; }

    .cook-note { margin: .4rem 0 0; padding-left: .6rem; border-left: 3px solid #dee2e6;
        font-size: .85rem; color: #495057; }
    .ingredient-tag { display: inline-block; padding: 0 .35rem; border-radius: .2rem; font-size: .7rem;
        text-transform: uppercase; letter-spacing: .03em; }
    .ingredient-tag--have { background: #d4edda; color: #1e5631; }
    .ingredient-tag--miss { background: #f8d7da; color: #7a1f24; }

    .badge-nudge { margin-top: .4rem; text-decoration: none; }

    .people-tabs { display: flex; flex-wrap: wrap; gap: .35rem; }
    .people-tab { padding: .2rem .7rem; border-radius: 1rem; border: 1px solid #ced4da;
        color: inherit; text-decoration: none; font-size: .85rem; }
    .people-tab--active { background: #343a40; border-color: #343a40; color: #fff; }

    .cooked-row { display: block; padding: .6rem .8rem; border: 1px solid #e9ecef; border-radius: .35rem; color: inherit; }
    .cooked-row:hover { border-color: #ced4da; }
    .cooked-row__name { font-weight: 600; }
    .cooked-row__date, .cooked-row__person { color: #6c757d; font-size: .85rem; }

    .rating-chip { display: inline-flex; align-items: baseline; gap: .2rem; color: #d98c1f;
        font-variant-numeric: tabular-nums; }
    .rating-chip__number { font-size: .85rem; }

    .nudge { padding: .7rem .9rem; border: 1px solid #ffe8a1; border-radius: .35rem; background: #fff9e6; }
    .nudge-list { list-style: none; padding-left: 0; }
</style>
{% endblock %}
